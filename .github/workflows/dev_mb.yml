name: Build and deploy JAR app to Azure Web App - mb

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Print repository tree (diagnostic)
        run: dir /s

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # ==== Opção A: se pom.xml está dentro de MajorBeatAPI ====
      - name: Build with Maven (using working-directory)
        working-directory: ./MajorBeatAPI
        run: mvn clean install

      # ==== Opção B alternativa: forçar local do pom com -f ====
      # - name: Build with Maven (using -f)
      #   run: mvn -f MajorBeatAPI/pom.xml clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: './MajorBeatAPI/target/*.jar'

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mb'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B6FF73C1039F461BB06CE940245221DE }}
