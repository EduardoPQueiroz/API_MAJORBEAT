## 2. Solução Definitiva (Forçar Debug)

Se o erro persistir, você deve inserir a etapa de debug abaixo para **confirmar o nome da pasta que contém o `pom.xml`**.

**Instrução:** Edite o seu arquivo `.yml` e adicione esta etapa **antes** da etapa `Build with Maven`:

```yaml
      - uses: actions/checkout@v4

      - name: Debug - Listar diretórios
        run: |
          echo "Current Directory:"
          pwd
          echo "Repository Files:"
          ls -R
          echo "--- End Debug ---"
```

**Onde Adicionar:**

```yaml
    steps:
      - uses: actions/checkout@v4
      
      # ADICIONE AQUI:
      - name: Debug - Listar diretórios
        run: |
          echo "Current Directory:"
          pwd
          echo "Repository Files:"
          ls -R
          echo "--- End Debug ---"
          
      - name: Set up Java version
      # ... o resto do seu arquivo
```

Depois de rodar o pipeline com essa etapa de Debug, clique no log **`Debug - Listar diretórios`** e me diga exatamente qual é o caminho mostrado que contém o arquivo **`pom.xml`**. Por exemplo, se o log mostrar:

```
./
./.github
./MajorBeatAPI/
./MajorBeatAPI/pom.xml  <-- ESTE É O QUE PRECISAMOS
```

Então o `working-directory` é **`./MajorBeatAPI`**. Se o log mostrar:

```
./
./API_MAJOREAT/
./API_MAJOREAT/MajorBeatAPI/
./API_MAJOREAT/MajorBeatAPI/pom.xml <-- ESTE É O QUE PRECISAMOS
