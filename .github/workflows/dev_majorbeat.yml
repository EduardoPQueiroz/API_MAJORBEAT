name: Build and deploy JAR app to Azure Web App - majorbeat

# ... (on, jobs, runs-on, permissions, steps)

    steps:
      - uses: actions/checkout@v4

      # ... (Set up Java version)

      - name: Build with Maven
        run: mvn clean install
        # ------------------------------------------------------------------
        # AJUSTE: Tentando apenas o nome da pasta do projeto, sem o prefixo API_MAJORBEAT
        working-directory: ./MajorBeatAPI 
        # ------------------------------------------------------------------

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          # Ajuste no path para o JAR
          path: '${{ github.workspace }}/MajorBeatAPI/target/*.jar' 

# ... (deploy job)
```

