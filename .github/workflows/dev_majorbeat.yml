name: Build and deploy JAR app to Azure Web App - majorbeat

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install
        # ------------------------------------------------------------------
        # AJUSTE CRÍTICO: Mudar o diretório de trabalho para o caminho aninhado
        # Com base no log D:\a\API_MAJOREAT\API_MAJORBEAT e na sua informação (MajorBeatAPI)
        working-directory: ./API_MAJORBEAT/MajorBeatAPI 
        # ------------------------------------------------------------------

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          # Ajuste no caminho para o JAR gerado
          path: '${{ github.workspace }}/API_MAJORBEAT/MajorBeatAPI/target/*.jar' 


  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'majorbeat'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B51C4FAFF1AF43B0A884B23E0F870806 }}
