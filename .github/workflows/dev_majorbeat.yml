name: Build and deploy JAR app to Azure Web App - majorbeat

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Debug - Listar diretórios para encontrar o pom.xml
        run: |
          echo "Current Directory:"
          pwd
          echo "Files:"
          ls -R
          echo "--- End Debug ---"

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven (skip tests)
        run: mvn clean package -DskipTests
        working-directory: ./MajorBeatAPI   # 👈 caminho relativo correto

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: './MajorBeatAPI/target/*.jar'   # 👈 caminho relativo ao repositório raiz

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'majorbeat'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B51C4FAFF1AF43B0A884B23E0F870806 }}
